name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize updates to the data branch; never overwrite another run's commit.
concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Check dependency compatibility
        run: |
          python -m unittest discover -s google_scholar_crawler/tests -v
          node google_scholar_crawler/tests/test_frontend.cjs

      - name: Fetch Google Scholar data
        working-directory: google_scholar_crawler
        run: |
          python -u - <<'PY'
          import os
          import requests
          for host in ('scholar.google.com', 'scholar.google.com.hk'):
              try:
                  response = requests.get(
                      'https://' + host + '/citations',
                      params={'user': os.environ['GOOGLE_SCHOLAR_ID'], 'hl': 'en', 'pagesize': 100},
                      timeout=20,
                  )
                  print(host, 'HTTP', response.status_code,
                        'profile_table=', 'gsc_rsb_st' in response.text, flush=True)
              except requests.RequestException as exc:
                  print(host, type(exc).__name__, flush=True)
          PY
          timeout 120s python -u main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

      # Only publish after a successful crawl. Failed crawls keep the previous data.
      - name: Check out citation data branch
        uses: actions/checkout@v7
        with:
          ref: google-scholar-stats
          path: citation-data

      - name: Publish citation data
        shell: bash
        run: |
          cp google_scholar_crawler/results/gs_data.json citation-data/gs_data.json
          cp google_scholar_crawler/results/gs_data_shieldsio.json citation-data/gs_data_shieldsio.json
          cd citation-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo "Citation data is unchanged."
            exit 0
          fi
          git commit -m "Updated Citation Data"
          git push origin HEAD:google-scholar-stats

      - name: Refresh citation-data CDN cache
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          for file in gs_data.json gs_data_shieldsio.json; do
            curl --fail --silent --show-error --retry 2 --max-time 30 \
              "https://purge.jsdelivr.net/gh/${REPOSITORY}@google-scholar-stats/${file}"
          done
