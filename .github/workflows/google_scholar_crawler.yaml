name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: UTC

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch attempt ${{ matrix.attempt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    # Different runner pools reduce the chance of reusing a blocked network.
    # The final job reports failure unless a real fetch succeeded.
    continue-on-error: true
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - attempt: 1
            os: ubuntu-24.04
          - attempt: 2
            os: macos-15
          - attempt: 3
            os: ubuntu-24.04-arm
    steps:
      - name: Check out site
        uses: actions/checkout@v7

      - name: Check out citation data branch
        uses: actions/checkout@v7
        with:
          ref: google-scholar-stats
          path: citation-data

      - name: Check whether this run already fetched data
        id: check
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('citation-data/gs_data.json').read_text())
          needed = (data.get('sync_run_id') != os.environ['GITHUB_RUN_ID'] or
                    data.get('sync_run_attempt') != os.environ.get('GITHUB_RUN_ATTEMPT', '1'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('needed=' + str(needed).lower() + '\n')
          print('Fetch needed:', needed)
          PY

      - name: Set up Python
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler dependencies
        if: steps.check.outputs.needed == 'true'
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Check compatibility and sync validation
        if: steps.check.outputs.needed == 'true'
        run: |
          python -m unittest discover -s google_scholar_crawler/tests -v
          node google_scholar_crawler/tests/test_frontend.cjs

      - name: Fetch Google Scholar data
        if: steps.check.outputs.needed == 'true'
        working-directory: google_scholar_crawler
        run: |
          python -u - <<'PY'
          import subprocess
          import sys
          try:
              result = subprocess.run([sys.executable, '-u', 'main.py'], timeout=120)
          except subprocess.TimeoutExpired:
              print('Google Scholar fetch exceeded 120 seconds', file=sys.stderr)
              sys.exit(124)
          sys.exit(result.returncode)
          PY
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}

      - name: Validate fetched data
        if: steps.check.outputs.needed == 'true'
        run: python google_scholar_crawler/verify_sync.py google_scholar_crawler/results

      - name: Publish citation data
        if: steps.check.outputs.needed == 'true'
        shell: bash
        run: |
          cp google_scholar_crawler/results/gs_data.json citation-data/gs_data.json
          cp google_scholar_crawler/results/gs_data_shieldsio.json citation-data/gs_data_shieldsio.json
          cd citation-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo "Citation data is unchanged."
            exit 0
          fi
          git commit -m "Updated Citation Data"
          git push origin HEAD:google-scholar-stats

  verify:
    name: Verify fresh data and refresh CDN
    needs: fetch
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@v7

      - name: Check out latest citation data
        uses: actions/checkout@v7
        with:
          ref: google-scholar-stats
          path: citation-data

      # The run marker prevents an old cached count from making failed fetches green.
      - name: Verify a real fetch succeeded in this run
        run: python3 google_scholar_crawler/verify_sync.py citation-data

      - name: Refresh citation-data CDN cache
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          for file in gs_data.json gs_data_shieldsio.json; do
            curl --fail --silent --show-error --retry 2 --max-time 30 \
              "https://purge.jsdelivr.net/gh/${REPOSITORY}@google-scholar-stats/${file}"
          done
