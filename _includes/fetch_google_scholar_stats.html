<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@';
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/';
        {% endif %}
        // Bypass the browser's week-long CDN cache; the scheduled workflow purges CDN edges.
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json?ts=" + Date.now(), function (data) {
            if (!data || typeof data !== 'object') return;
            var totalCitation = data.citedby;
            var totalElement = document.getElementById('total_cit');
            if (totalElement && typeof totalCitation === 'number' &&
                Number.isInteger(totalCitation) && totalCitation >= 0) {
                totalElement.textContent = '(' + totalCitation.toLocaleString('en-US') + ' citations)';
                totalElement.hidden = false;
                if (typeof data.updated === 'string') {
                    totalElement.title = 'Google Scholar data updated ' + data.updated.slice(0, 10);
                }
            }
            var publications = data.publications || {};
            var citationElements = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationElements, function (element) {
                var publication = publications[element.getAttribute('data')];
                if (publication && typeof publication.num_citations === 'number' &&
                    Number.isInteger(publication.num_citations) && publication.num_citations >= 0) {
                    element.textContent = '| Citations: ' + publication.num_citations;
                }
            });
        }).fail(function () {
            // Keep the Scholar link usable; unavailable data must not appear as zero.
            console.warn('Google Scholar citation data could not be loaded.');
        });
    });
</script>
